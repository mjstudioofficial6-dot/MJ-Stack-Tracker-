name: build-debug-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'MJ_Stack_Tracker_BUILD0_SOURCE.zip'
      - '.github/workflows/build-debug-apk.yml'

permissions:
  contents: read

concurrency:
  group: mj-stack-tracker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and verify BUILD-0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # IMPORTANT: unpack before setup-gradle. Earlier workflow failed because
      # the repository contained only a ZIP, so Gradle could not find build.gradle.
      - name: Extract Android project at repository root
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="$GITHUB_WORKSPACE/MJ_Stack_Tracker_BUILD0_SOURCE.zip"
          if [[ ! -s "$SOURCE_ZIP" ]]; then
            echo "ERROR: MJ_Stack_Tracker_BUILD0_SOURCE.zip is missing or empty at repository root."
            echo "Upload the supplied source ZIP to the top level of the repository."
            exit 1
          fi
          unzip -oq "$SOURCE_ZIP" -d "$GITHUB_WORKSPACE"
          for required in build.gradle settings.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/mjthakur/stacktracker/MainActivity.java; do
            if [[ ! -s "$GITHUB_WORKSPACE/$required" ]]; then
              echo "ERROR: Required project file missing after extraction: $required"
              exit 1
            fi
          done
          echo "Project files are at the repository root."
          ls -la "$GITHUB_WORKSPACE"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # setup-gradle must run after ZIP extraction so it can detect build.gradle.
      - name: Set up pinned Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          validate-wrappers: false

      - name: Show tool versions
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      # Bootstrap a complete wrapper on the runner; then use the wrapper for build.
      - name: Generate Gradle Wrapper
        run: gradle --no-daemon wrapper --gradle-version 9.6.0 --distribution-type bin

      - name: Verify generated wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MJ-Stack-Tracker-BUILD-0-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: MJ-Stack-Tracker-BUILD-0-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
          
