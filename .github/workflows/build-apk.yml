name: Build APK from uploaded source ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'MJ_Stack_Tracker_StepA.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: mj-stack-tracker-zip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository (ZIP + workflow only)
        uses: actions/checkout@v7.0.1

      - name: Verify and extract source archive
        shell: bash
        run: |
          test -s MJ_Stack_Tracker_StepA.zip
          mkdir -p "$RUNNER_TEMP/MJ-Stack-Tracker-source"
          unzip -q "$GITHUB_WORKSPACE/MJ_Stack_Tracker_StepA.zip" -d "$RUNNER_TEMP/MJ-Stack-Tracker-source"
          test -s "$RUNNER_TEMP/MJ-Stack-Tracker-source/settings.gradle"
          test -s "$RUNNER_TEMP/MJ-Stack-Tracker-source/app/build.gradle"
          echo "PROJECT_DIR=$RUNNER_TEMP/MJ-Stack-Tracker-source" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up pinned Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Run structural project checks
        run: python3 scripts/validate_project.py
        working-directory: ${{ runner.temp }}/MJ-Stack-Tracker-source

      - name: Build debug APK from extracted ZIP
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug
        working-directory: ${{ runner.temp }}/MJ-Stack-Tracker-source

      - name: Verify APK
        shell: bash
        run: |
          test -s "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MJ-Stack-Tracker-StepA-debug-APK
          path: ${{ runner.temp }}/MJ-Stack-Tracker-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MJ-Stack-Tracker-StepA-build-reports
          path: ${{ runner.temp }}/MJ-Stack-Tracker-source/**/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
          
