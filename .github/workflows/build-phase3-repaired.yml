name: Build MJ Stack Tracker Phase 3 Repaired

on:
  workflow_dispatch:
  push:
    paths:
      - 'MJ_Stack_Tracker_PHASE3_REPAIRED.zip'
      - '.github/workflows/build-phase3-repaired.yml'

permissions:
  contents: read

jobs:
  build:
    name: Validate and build repaired Phase 3 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Verify repaired source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="MJ_Stack_Tracker_PHASE3_REPAIRED.zip"
          if [[ ! -f "$ZIP_NAME" ]]; then
            echo "ERROR: $ZIP_NAME is missing from the repository root."
            exit 1
          fi
          python3 - <<'PY'
          import sys, zipfile
          archive = 'MJ_Stack_Tracker_PHASE3_REPAIRED.zip'
          required = {
              'build.gradle',
              'settings.gradle',
              'gradle.properties',
              'app/build.gradle',
              'app/src/main/AndroidManifest.xml',
              'app/src/main/java/com/mj/stacktracker/MainActivity.java',
              'app/src/main/java/com/mj/stacktracker/LocalHistoryDb.java',
              'app/src/main/java/com/mj/stacktracker/FrameDetector.java',
              'app/src/main/java/com/mj/stacktracker/TrackManager.java',
              'app/src/main/java/com/mj/stacktracker/FrameOverlayView.java',
              'app/src/main/java/com/mj/stacktracker/MetricMath.java',
          }
          with zipfile.ZipFile(archive) as z:
              entries = set(z.namelist())
              detector = z.read('app/src/main/java/com/mj/stacktracker/FrameDetector.java').decode('utf-8')
          missing = sorted(required - entries)
          if missing:
              print('ERROR: required files missing from ZIP:', file=sys.stderr)
              for item in missing:
                  print('  - ' + item, file=sys.stderr)
              sys.exit(1)
          if 'COLOR_RGBA2HSV' in detector:
              print('ERROR: obsolete COLOR_RGBA2HSV constant remains in FrameDetector.java', file=sys.stderr)
              sys.exit(1)
          if 'Imgproc.COLOR_RGBA2RGB' not in detector or 'Imgproc.COLOR_RGB2HSV' not in detector:
              print('ERROR: expected two-step RGBA -> RGB -> HSV conversion not found', file=sys.stderr)
              sys.exit(1)
          print('Archive layout and OpenCV conversion check passed.')
          PY

      - name: Extract Android project to workspace root
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq MJ_Stack_Tracker_PHASE3_REPAIRED.zip -d "$GITHUB_WORKSPACE"
          for file in build.gradle settings.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: required extracted project file missing: $file"
              exit 1
            fi
          done
          echo "Project root verified: $GITHUB_WORKSPACE"

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up pinned Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.6.0'

      - name: Build repaired Phase 3 debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleDebug 2>&1 | tee build.log

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "ERROR: APK not found or empty: $APK"
            exit 1
          fi
          ls -lh "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload repaired Phase 3 debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MJ-Stack-Tracker-Phase3-Repaired-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MJ-Stack-Tracker-Phase3-Repaired-build-diagnostics
          path: |
            build.log
            apk-sha256.txt
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
          
