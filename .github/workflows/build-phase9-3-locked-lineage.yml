name: Build MJ Stack Tracker Phase 9.3 Locked Lineage

on:
  workflow_dispatch:
  push:
    paths:
      - 'MJ_STACK_TRACKER_PHASE9_3_LOCKED_LINEAGE_SOURCE_FINAL.zip'
      - 'README.md'
      - '.github/workflows/build-phase9-3-locked-lineage.yml'

permissions:
  contents: read

jobs:
  build:
    name: Validate, test and build Phase 9.3 locked-lineage build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate source archive and locked-lineage regression controls
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="MJ_STACK_TRACKER_PHASE9_3_LOCKED_LINEAGE_SOURCE_FINAL.zip"
          [[ -s "$ZIP_NAME" ]] || { echo "ERROR: $ZIP_NAME must exist in the repository root."; exit 1; }
          python3 - <<'PY'
          import sys, zipfile
          zname = 'MJ_STACK_TRACKER_PHASE9_3_LOCKED_LINEAGE_SOURCE_FINAL.zip'
          required = {
              'settings.gradle', 'build.gradle', 'gradle.properties', 'README.md',
              'app/build.gradle', 'app/src/main/AndroidManifest.xml',
              'app/src/main/res/xml/session_export_paths.xml',
              'app/src/main/java/com/mj/stacktracker/MainActivity.java',
              'app/src/main/java/com/mj/stacktracker/FrameDetector.java',
              'app/src/main/java/com/mj/stacktracker/FrameOverlayView.java',
              'app/src/main/java/com/mj/stacktracker/TrackManager.java',
              'app/src/main/java/com/mj/stacktracker/DetectionCandidate.java',
              'app/src/main/java/com/mj/stacktracker/LocalHistoryDb.java',
              'app/src/main/java/com/mj/stacktracker/MetricMath.java',
              'app/src/main/java/com/mj/stacktracker/StackLedger.java',
              'app/src/main/java/com/mj/stacktracker/LayerModelView.java',
              'app/src/test/java/com/mj/stacktracker/StackLedgerTest.java',
              'app/src/test/java/com/mj/stacktracker/MetricMathTest.java',
              'app/src/test/java/com/mj/stacktracker/TrackManagerTest.java',
              'PHASE9_REQUIREMENT_AUDIT.md',
          }
          with zipfile.ZipFile(zname) as z:
              bad = z.testzip()
              if bad:
                  sys.exit(f'Corrupt ZIP entry: {bad}')
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  sys.exit('Missing archive entries:\n' + '\n'.join(missing))
              text = {n: z.read(n).decode('utf-8', errors='replace') for n in required if n.endswith(('.java', '.xml', '.gradle', '.md'))}
              main = text['app/src/main/java/com/mj/stacktracker/MainActivity.java']
              overlay = text['app/src/main/java/com/mj/stacktracker/FrameOverlayView.java']
              tracker = text['app/src/main/java/com/mj/stacktracker/TrackManager.java']
              detector = text['app/src/main/java/com/mj/stacktracker/FrameDetector.java']
              gradle = text['app/build.gradle']
              manifest = text['app/src/main/AndroidManifest.xml']
              checks = {
                  'work-area selection and saved rectangle hide': 'MARK WORK AREA' in main and 'setWorkAreaVisible(false)' in main and 'setWorkAreaVisible(boolean visible)' in overlay,
                  'initial master lock control': 'LOCK OBJECT' in main,
                  'stable locked-object root': 'PILE-01' in tracker and 'seedMaster(masterBox)' in main and 'looksLikeWholeMaster(d,t)' in tracker,
                  'child creation requires parent boundary and separation evidence': 'findSplitParent(d,before)' in tracker and 'updateSeparationEvidence(chosen,d,before)' in tracker and 'MIN_DETACHED_FRAMES_TO_CONFIRM' in tracker,
                  'nested and unrelated contours are gated': 'MAX_PARENT_CONTAINMENT' in tracker and 'MIN_CHILD_OUTSIDE_FRACTION' in tracker and 'parentSpawnedThisFrame.contains(possibleParent.id)' in tracker,
                  'temporary candidates cannot consume public pile IDs or add early history': 'PENDING-' in tracker and 'chosen.id=makeId(nextId++)' in tracker and 'POSSIBLE_SPLIT' not in tracker,
                  'stale root tracking rectangle is hidden when no current match exists': 'Do not draw a stale fixed box' in tracker and 'setMasterBoxVisible(false)' in main and 'hasMasterBox && masterBoxVisible' in overlay,
                  'conservation ledger': 'initial + added' in text['app/src/main/java/com/mj/stacktracker/StackLedger.java'] or 'getAccountedTotal' in text['app/src/main/java/com/mj/stacktracker/StackLedger.java'],
                  'separate table/side calibration controls': 'TABLE CALIBRATION' in main and 'STACK-SIDE CALIBRATION' in main,
                  'history export': 'EXPORT JSON' in main and 'EXPORT CSV' in main,
                  'event review and session delete/share': 'updateEventStatus' in text['app/src/main/java/com/mj/stacktracker/LocalHistoryDb.java'] and 'deleteEvent' in text['app/src/main/java/com/mj/stacktracker/LocalHistoryDb.java'] and 'deleteSession' in text['app/src/main/java/com/mj/stacktracker/LocalHistoryDb.java'] and 'shareSession' in main,
                  'automatic local session folder and shareable ZIP report': 'createSessionBundleArchive(sessionId)' in main and 'shareSessionArchive(sessionId, name)' in main and 'FileProvider.getUriForFile' in main and 'technical-events.json' in main and 'pileTimeline' in main and 'getSessionEvents(long sessionId)' in text['app/src/main/java/com/mj/stacktracker/LocalHistoryDb.java'] and 'androidx.core.content.FileProvider' in manifest and 'session_export_paths' in manifest and '<files-path name="session_exports" path="session_exports/"' in text['app/src/main/res/xml/session_export_paths.xml'],
                  'AndroidX Core dependency for FileProvider': 'androidx.core:core:1.17.0' in gradle,
                  'Phase 9.3 version': "versionName '0.9.3'" in gradle and "versionCode 12" in gradle,
                  'Phase 9 package ID remains consistent for in-place upgrade': "applicationId 'com.mj.stacktracker.phase9'" in gradle,
                  'locked object seeds Pile 1': 'manager.seedMaster(masterBox)' in main and 'void seedMaster(float[] box)' in tracker,
                  'child tracks cannot steal Pile 1 identity': 'looksLikeWholeMaster(d,t)' in tracker and 'intersectionArea(d.left' in tracker,
                  'locked-lineage regression tests included': 'app/src/test/java/com/mj/stacktracker/TrackManagerTest.java' in names and all(x in z.read('app/src/test/java/com/mj/stacktracker/TrackManagerTest.java').decode('utf-8') for x in ['contourFullyInsideLockedObjectIsNotAChildPile','edgeContourThatNeverSeparatesDoesNotBecomePile','childMustTouchLockedObjectThenMoveAwayAndPersist']),
                  'human-readable chronological pile history persists': 'private void refreshPileRows(String query)' in main and 'PILE_CREATED' in main and 'PILE_COUNT_UPDATED' in main and 'PILE_STATUS' in main and 'getPileEvents(pileSessionId)' in main and 'setPiles(names, counts, estimated' in main,
                  'pile model synchronizes to saved video timestamps': 'updateModelTimelineAtPlaybackPosition(playheadMs)' in main and 'buildPileStateMap(events, playheadMs)' in main and 'Video timeline' in main,
                  'CSV export implementation exists': 'private String buildCsvExport()' in main and 'private void appendCsvRow(' in main and 'private String csvCell(' in main,
                  'calibration JSON uses non-throwing JSONArray object overload': 'array.put((Object) Double.valueOf((double) value));' in main and 'import org.json.JSONException;' not in main and 'catch (JSONException e)' not in main,
                  'correct OpenCV colour conversion': 'COLOR_RGBA2HSV' not in detector and 'COLOR_RGB2HSV' in detector,
                  'no camera permission': 'android.permission.CAMERA' not in manifest,
                  'no internet permission': 'android.permission.INTERNET' not in manifest,
                  'fixed video viewport is not wrapped in the root vertical ScrollView': 'root.addView(videoViewport' in main and 'setContentView(root)' in main and 'ScrollView scroll=new ScrollView(this)' not in main,
                  'horizontal Model/Video/History panels with controls relocated': 'HorizontalScrollView pageScroller' in main and 'MODEL & INVENTORY' in main and 'VIDEO & ANALYSIS' in main and 'HISTORY & EXPORT' in main and main.index('PanelPage videoPage = createPanelPage("VIDEO & ANALYSIS")') < main.index('addButton(masterRow, "LOCK OBJECT"') and main.index('addButton(calRow, "TABLE CALIBRATION"') > main.index('PanelPage videoPage = createPanelPage("VIDEO & ANALYSIS")'),
                  'pinch zoom and two-finger pan support': 'ACTION_POINTER_DOWN' in main and 'zoomScale = Math.max(1f, Math.min(5f, zoomScale * factor))' in main and 'RESET VIDEO ZOOM' in main,
                  'separate slow-motion toolbar removed': 'Review speed — slower playback is supported' not in main and '0.25x' not in main and '0.75x' not in main,
                  'JSON/CSV exports grouped with history': main.index('EXPORT JSON') > main.index('HISTORY & EXPORT') and main.index('EXPORT CSV') > main.index('HISTORY & EXPORT'),
                  'master rectangle selection implemented': 'setMasterSelectionMode' in overlay and 'OnMasterStackSelectedListener' in overlay,
                  'event tap seeks matching source video timestamp': 'player.seekTo(Math.max(0L,e.timestampMs))' in main and 'getSessionUri(e.sessionId)' in main,
              }
              for label, ok in checks.items():
                  print(('PASS: ' if ok else 'FAIL: ') + label)
              failed = [label for label, ok in checks.items() if not ok]
              if failed:
                  sys.exit('Source validation failed: ' + ', '.join(failed))
          print('Source archive validation passed.')
          PY

      - name: Replace stale phase source in runner workspace and extract final archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties
          unzip -oq MJ_STACK_TRACKER_PHASE9_3_LOCKED_LINEAGE_SOURCE_FINAL.zip -d "$GITHUB_WORKSPACE"
          for path in build.gradle settings.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml; do
            [[ -s "$path" ]] || { echo "ERROR: missing extracted project path: $path"; exit 1; }
          done
          echo "Extracted the single Phase 9 source tree; no old phase source is mixed into compilation."

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install required Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Restore stable debug signing key for app upgrades
        uses: actions/cache/restore@v6
        with:
          path: ~/.android/debug.keystore
          key: mj-stack-tracker-phase9-debug-keystore-v1

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Save debug signing key for future compatible installs
        if: success() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/cache/save@v6
        with:
          path: ~/.android/debug.keystore
          key: mj-stack-tracker-phase9-debug-keystore-v1

      - name: Verify APK metadata, archive and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [[ -s "$APK" ]] || { echo "ERROR: APK missing: $APK"; exit 1; }
          unzip -t "$APK" | tail -n 2
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          [[ -x "$AAPT" ]] || { echo "ERROR: aapt not found at $AAPT"; exit 1; }
          [[ -x "$APKSIGNER" ]] || { echo "ERROR: apksigner not found at $APKSIGNER"; exit 1; }
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.mj.stacktracker.phase9' versionCode='12' versionName='0.9.3'" apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > signing-details.txt
          sha256sum "$APK" | tee apk-sha256.txt
          ls -lh "$APK"

      - name: Upload Phase 9.3 debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MJ-Stack-Tracker-Phase9.3-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            signing-details.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MJ-Stack-Tracker-Phase9.3-build-diagnostics
          path: |
            build.log
            apk-badging.txt
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 30
