name: Build MJ Stack Tracker Phase 9.4 Geometry Lineage

on:
  workflow_dispatch:
  push:
    paths:
      - 'MJ_STACK_TRACKER_PHASE9_4_GEOMETRY_LINEAGE_SOURCE.zip'
      - 'README.md'
      - '.github/workflows/build-phase9-4-geometry-lineage.yml'

permissions:
  contents: read

jobs:
  build:
    name: Validate, test and build Phase 9.4 geometry-lineage APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate the exact source ZIP and Phase 9.4 regressions
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="MJ_STACK_TRACKER_PHASE9_4_GEOMETRY_LINEAGE_SOURCE.zip"
          [[ -s "$ZIP_NAME" ]] || { echo "ERROR: $ZIP_NAME must exist in the repository root."; exit 1; }
          python3 - <<'PY'
          import sys, zipfile
          zname = 'MJ_STACK_TRACKER_PHASE9_4_GEOMETRY_LINEAGE_SOURCE.zip'
          required = {
              'settings.gradle', 'build.gradle', 'gradle.properties', 'README.md',
              'PHASE9_REQUIREMENT_AUDIT.md', 'PHASE9_4_VALIDATION_REPORT.txt',
              'app/build.gradle', 'app/src/main/AndroidManifest.xml',
              'app/src/main/res/xml/session_export_paths.xml',
              'app/src/main/java/com/mj/stacktracker/MainActivity.java',
              'app/src/main/java/com/mj/stacktracker/FrameDetector.java',
              'app/src/main/java/com/mj/stacktracker/FrameOverlayView.java',
              'app/src/main/java/com/mj/stacktracker/TrackManager.java',
              'app/src/main/java/com/mj/stacktracker/DetectionCandidate.java',
              'app/src/main/java/com/mj/stacktracker/StackGeometry.java',
              'app/src/main/java/com/mj/stacktracker/LocalHistoryDb.java',
              'app/src/main/java/com/mj/stacktracker/MetricMath.java',
              'app/src/main/java/com/mj/stacktracker/StackLedger.java',
              'app/src/main/java/com/mj/stacktracker/LayerModelView.java',
              'app/src/test/java/com/mj/stacktracker/StackLedgerTest.java',
              'app/src/test/java/com/mj/stacktracker/MetricMathTest.java',
              'app/src/test/java/com/mj/stacktracker/StackGeometryTest.java',
              'app/src/test/java/com/mj/stacktracker/TrackManagerTest.java',
          }
          with zipfile.ZipFile(zname) as z:
              bad = z.testzip()
              if bad:
                  sys.exit(f'Corrupt ZIP entry: {bad}')
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  sys.exit('Missing archive entries:\n' + '\n'.join(missing))
              if any(n.startswith(('javac-out/', 'test-stubs/', '.git/')) for n in names):
                  sys.exit('Archive contains local test stubs or build leftovers.')
              text = {n: z.read(n).decode('utf-8', errors='replace') for n in required if n.endswith(('.java', '.xml', '.gradle', '.md', '.txt'))}
              main = text['app/src/main/java/com/mj/stacktracker/MainActivity.java']
              overlay = text['app/src/main/java/com/mj/stacktracker/FrameOverlayView.java']
              tracker = text['app/src/main/java/com/mj/stacktracker/TrackManager.java']
              detector = text['app/src/main/java/com/mj/stacktracker/FrameDetector.java']
              geometry = text['app/src/main/java/com/mj/stacktracker/StackGeometry.java']
              geometry_test = text['app/src/test/java/com/mj/stacktracker/StackGeometryTest.java']
              tracker_test = text['app/src/test/java/com/mj/stacktracker/TrackManagerTest.java']
              gradle = text['app/build.gradle']
              manifest = text['app/src/main/AndroidManifest.xml']
              ledger = text['app/src/main/java/com/mj/stacktracker/StackLedger.java']
              history = text['app/src/main/java/com/mj/stacktracker/LocalHistoryDb.java']
              checks = {
                  'Phase 9.4 versionCode and versionName': "versionCode 13" in gradle and "versionName '0.9.4'" in gradle,
                  'package ID stays stable for update install': "applicationId 'com.mj.stacktracker.phase9'" in gradle,
                  'AndroidX Core FileProvider dependency retained': 'androidx.core:core:1.17.0' in gradle and 'androidx.core.content.FileProvider' in manifest,
                  'known JSONArray checked-exception failure remains fixed': 'array.put((Object) Double.valueOf((double) value));' in main and 'import org.json.JSONException;' not in main and 'catch (JSONException e)' not in main,
                  'no camera or internet runtime permission': 'android.permission.CAMERA' not in manifest and 'android.permission.INTERNET' not in manifest,
                  'video remains fixed; no root vertical scroll view': 'root.addView(videoViewport' in main and 'setContentView(root)' in main and 'ScrollView scroll=new ScrollView(this)' not in main,
                  'Model, Video/Analysis, History panels remain in required order': 'HorizontalScrollView pageScroller' in main and 'MODEL & INVENTORY' in main and 'VIDEO & ANALYSIS' in main and 'HISTORY & EXPORT' in main and main.index('PanelPage videoPage = createPanelPage("VIDEO & ANALYSIS")') < main.index('addButton(masterRow, "LOCK OBJECT"') and main.index('addButton(calRow, "TABLE CALIBRATION"') > main.index('PanelPage videoPage = createPanelPage("VIDEO & ANALYSIS")'),
                  'movement area hides after saving': 'frameOverlay.setWorkAreaVisible(false)' in main and 'setWorkAreaVisible(boolean visible)' in overlay,
                  'object lock seeds the lineage root and is hidden while tracking': 'manager.seedMaster(masterBox)' in main and 'setMasterBoxVisible(false)' in main and 'void seedMaster(float[] box)' in tracker,
                  'root box follows predicted position/matched contour': 'predCx=(t.left+t.right)*0.5f+t.velocityX' in tracker and 't.left=0.25f*t.left+0.75f*d.left' in tracker and 'lockedObjectFollowsMovementInsteadOfStayingAtLockCoordinates' in tracker_test,
                  'tiny contour cannot hijack Pile 1 before confirmed split': 'maxAreaRatio=confirmedDirectChild?18f:5.5f' in tracker and 'smallBrightContourCannotTakeOverPileOneBeforeAnySplitIsConfirmed' in tracker_test,
                  'a parent can create four children in one split': 'oneParentCanCreateFourChildPilesInSameSplit' in tracker_test and 'Do not limit this to one' in tracker,
                  'child piles may split into grandchildren': 'aConfirmedChildCanItselfSplitIntoGrandchildren' in tracker_test and 'findSplitParent(d,tracks)' in tracker,
                  'nested and unrelated contours are gated': 'MAX_PARENT_CONTAINMENT' in tracker and 'MIN_CHILD_OUTSIDE_FRACTION' in tracker and 'findSplitParent(d,before)' in tracker,
                  'stale pending-child limitation has not reappeared': 'parentSpawnedThisFrame' not in tracker,
                  'merge/occlusion and root/child disappearance retain history': 'PILE_MERGE_SUSPECTED' in tracker and 'TRACK_NOT_VISIBLE' in tracker and 'if(t.confirmed&&t.missed==MAX_MISSED_FRAMES+1)' in tracker and 'masterPileDisappearanceIsLoggedButIdentityCanReturn' in tracker_test and 'saveEvent(sessionId,timestampMs,"PILE_STATUS"' in main,
                  'counts derive from measured geometry and calibration': 'estimatePileCount(' in main and 'pieceThickness' in main and 'rootReferenceSpanPx' in main and 'axisSpanPixels' in geometry and 'stackHeightMm' in main,
                  'true rotated-rectangle projection is implemented and tested': 'Math.abs(Math.cos(delta)) * majorPixels + Math.abs(Math.sin(delta)) * minorPixels' in geometry and '84.8528137d' in geometry_test,
                  'measurement uncertainty and calibration mismatch are represented': 'countSigma' in geometry and 'calibrationConsistentWithKnownCount' in main and 'MEASUREMENT_CALIBRATION_WARNING' in main,
                  'no arithmetic forcing to initial inventory': 'ESTIMATE_BALANCE_REVIEW' in main and 'No value has been forced to balance' in main,
                  'candidate cap supports multi-way splits': 'MAX_CANDIDATES = 32' in detector,
                  'readable history includes parent, measured dimensions and rough uncertainty': 'private void refreshPileRows(String query)' in main and 'parentPileNo' in main and 'dimensionSummary(event.details)' in main and 'rough count uncertainty' in main,
                  'session archive and CSV/JSON export retained': 'createSessionBundleArchive(sessionId)' in main and 'buildCsvExport()' in main and 'EXPORT JSON' in main and 'EXPORT CSV' in main,
                  'horizontal pinch zoom 1x to 5x retained': 'ACTION_POINTER_DOWN' in main and 'zoomScale = Math.max(1f, Math.min(5f, zoomScale * factor))' in main,
                  'tracking and geometry regression tests are packaged': 'oneParentCanCreateFourChildPilesInSameSplit' in tracker_test and 'invalidCalibrationProducesUncalibratedDimensionsInsteadOfFakeValues' in geometry_test,
                  'ledger and history database remain part of source': 'getAccountedTotal' in ledger and 'deleteSession' in history and 'getSessionEvents(long sessionId)' in history,
              }
              for label, ok in checks.items():
                  print(('PASS: ' if ok else 'FAIL: ') + label)
              failed = [label for label, ok in checks.items() if not ok]
              if failed:
                  sys.exit('Source validation failed: ' + ', '.join(failed))
          print('Phase 9.4 source archive validation passed.')
          PY

      - name: Clear stale project tree and extract this exact source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties
          unzip -oq MJ_STACK_TRACKER_PHASE9_4_GEOMETRY_LINEAGE_SOURCE.zip -d "$GITHUB_WORKSPACE"
          for path in build.gradle settings.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml; do
            [[ -s "$path" ]] || { echo "ERROR: missing extracted project path: $path"; exit 1; }
          done
          grep -F "versionName '0.9.4'" app/build.gradle
          echo "Only the Phase 9.4 archive is compiled; old app source files were removed first."

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Restore stable debug signing key for app upgrades
        uses: actions/cache/restore@v6
        with:
          path: ~/.android/debug.keystore
          key: mj-stack-tracker-phase9-debug-keystore-v1

      - name: Run Android unit tests and build the debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Save debug signing key for future compatible installs
        if: success() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/cache/save@v6
        with:
          path: ~/.android/debug.keystore
          key: mj-stack-tracker-phase9-debug-keystore-v1

      - name: Verify APK, package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [[ -s "$APK" ]] || { echo "ERROR: APK missing: $APK"; exit 1; }
          unzip -t "$APK" | tail -n 2
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          [[ -x "$AAPT" ]] || { echo "ERROR: aapt not found at $AAPT"; exit 1; }
          [[ -x "$APKSIGNER" ]] || { echo "ERROR: apksigner not found at $APKSIGNER"; exit 1; }
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.mj.stacktracker.phase9' versionCode='13' versionName='0.9.4'" apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > signing-details.txt
          sha256sum "$APK" | tee apk-sha256.txt
          ls -lh "$APK"

      - name: Upload Phase 9.4 debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MJ-Stack-Tracker-Phase9.4-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            signing-details.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MJ-Stack-Tracker-Phase9.4-build-diagnostics
          path: |
            build.log
            apk-badging.txt
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 30
