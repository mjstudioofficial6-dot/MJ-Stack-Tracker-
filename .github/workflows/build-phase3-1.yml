name: Build MJ Stack Tracker Phase 3.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'MJ_Stack_Tracker_PHASE3_1_SOURCE.zip'
      - '.github/workflows/build-phase3-1.yml'

permissions:
  contents: read

jobs:
  build:
    name: Validate and build Phase 3.1 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate source ZIP and Phase 3.1 corrections
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="MJ_Stack_Tracker_PHASE3_1_SOURCE.zip"
          if [[ ! -s "$ZIP_NAME" ]]; then
            echo "ERROR: $ZIP_NAME is missing from the repository root."
            exit 1
          fi
          python3 - <<'PY'
          import sys, zipfile
          archive = 'MJ_Stack_Tracker_PHASE3_1_SOURCE.zip'
          required = {
              'build.gradle', 'settings.gradle', 'gradle.properties',
              'app/build.gradle', 'app/src/main/AndroidManifest.xml',
              'app/src/main/java/com/mj/stacktracker/MainActivity.java',
              'app/src/main/java/com/mj/stacktracker/FrameDetector.java',
              'app/src/main/java/com/mj/stacktracker/TrackManager.java',
              'app/src/main/java/com/mj/stacktracker/FrameOverlayView.java',
              'app/src/main/java/com/mj/stacktracker/DetectionCandidate.java',
              'app/src/main/java/com/mj/stacktracker/LocalHistoryDb.java',
              'app/src/main/java/com/mj/stacktracker/MetricMath.java',
          }
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  print('Missing required project files:', file=sys.stderr)
                  print('\n'.join(missing), file=sys.stderr)
                  sys.exit(1)
              main = z.read('app/src/main/java/com/mj/stacktracker/MainActivity.java').decode('utf-8')
              detector = z.read('app/src/main/java/com/mj/stacktracker/FrameDetector.java').decode('utf-8')
              manager = z.read('app/src/main/java/com/mj/stacktracker/TrackManager.java').decode('utf-8')
              manifest = z.read('app/src/main/AndroidManifest.xml').decode('utf-8')
              if 'COLOR_RGBA2HSV' in detector:
                  raise SystemExit('Obsolete OpenCV COLOR_RGBA2HSV constant found.')
              checks = {
                  'user-marked ROI button': 'MARK WORK AREA' in main,
                  'analysis uses ROI detector': 'frameDetector.detect(frame,workArea)' in main,
                  'ROI-only crop maps back to full frame': 'roiL+(r.x/(float)w)*roiW' in detector,
                  'candidate persistence confirmation': 'MIN_HITS_TO_CONFIRM=2' in manager,
                  'Phase 3.1 version': "versionName '0.3.1'" in z.read('app/build.gradle').decode('utf-8'),
              }
              for label, ok in checks.items():
                  print(('PASS: ' if ok else 'FAIL: ') + label)
                  if not ok: sys.exit(1)
              if 'android.permission.CAMERA' in manifest:
                  raise SystemExit('Unexpected CAMERA permission found.')
          print('ZIP structure and Phase 3.1 source checks passed.')
          PY

      - name: Extract source project to workspace root
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq MJ_Stack_Tracker_PHASE3_1_SOURCE.zip -d "$GITHUB_WORKSPACE"
          for file in build.gradle settings.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml; do
            [[ -s "$file" ]] || { echo "ERROR: project file missing after extraction: $file"; exit 1; }
          done
          echo "Project root: $GITHUB_WORKSPACE"

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.6.0'

      - name: Build Phase 3.1 debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleDebug 2>&1 | tee build.log

      - name: Verify APK output and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [[ -s "$APK" ]] || { echo "ERROR: APK missing: $APK"; exit 1; }
          ls -lh "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload Phase 3.1 debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MJ-Stack-Tracker-Phase3.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MJ-Stack-Tracker-Phase3.1-build-diagnostics
          path: |
            build.log
            apk-sha256.txt
            app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
