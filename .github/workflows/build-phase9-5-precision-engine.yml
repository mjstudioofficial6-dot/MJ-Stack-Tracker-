name: Build MJ Stack Tracker Phase 9.5 Precision Engine

on:
  workflow_dispatch:
  push:
    paths:
      - 'MJ_STACK_TRACKER_PHASE9_5_PRECISION_ENGINE_SOURCE.zip'
      - '.github/workflows/build-phase9-5-precision-engine.yml'

permissions:
  contents: read

jobs:
  build:
    name: Validate, test and build Phase 9.5 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate source ZIP, app baseline and precision engine module
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="MJ_STACK_TRACKER_PHASE9_5_PRECISION_ENGINE_SOURCE.zip"
          [[ -s "$ZIP_NAME" ]] || { echo "ERROR: $ZIP_NAME must exist in repository root."; exit 1; }
          python3 - <<'PY'
          import sys, zipfile
          import xml.etree.ElementTree as ET

          zname = 'MJ_STACK_TRACKER_PHASE9_5_PRECISION_ENGINE_SOURCE.zip'
          required = {
              'settings.gradle', 'build.gradle', 'gradle.properties', 'README.md',
              'PHASE9_5_PRECISION_ENGINE_AUDIT.md', 'PHASE9_5_VALIDATION_REPORT.txt',
              'app/build.gradle', 'app/src/main/AndroidManifest.xml',
              'app/src/main/res/xml/session_export_paths.xml',
              'app/src/main/java/com/mj/stacktracker/MainActivity.java',
              'app/src/main/java/com/mj/stacktracker/FrameDetector.java',
              'app/src/main/java/com/mj/stacktracker/FrameOverlayView.java',
              'app/src/main/java/com/mj/stacktracker/TrackManager.java',
              'app/src/main/java/com/mj/stacktracker/DetectionCandidate.java',
              'app/src/main/java/com/mj/stacktracker/StackGeometry.java',
              'app/src/main/java/com/mj/stacktracker/LocalHistoryDb.java',
              'app/src/main/java/com/mj/stacktracker/MetricMath.java',
              'app/src/main/java/com/mj/stacktracker/StackLedger.java',
              'app/src/main/java/com/mj/stacktracker/LayerModelView.java',
              'app/src/test/java/com/mj/stacktracker/StackLedgerTest.java',
              'app/src/test/java/com/mj/stacktracker/MetricMathTest.java',
              'app/src/test/java/com/mj/stacktracker/StackGeometryTest.java',
              'app/src/test/java/com/mj/stacktracker/TrackManagerTest.java',
              'cardchange-engine/build.gradle',
              'cardchange-engine/consumer-rules.pro',
              'cardchange-engine/src/main/AndroidManifest.xml',
              'cardchange-engine/src/main/java/com/mj/stacktracker/engine/EngineResult.java',
              'cardchange-engine/src/main/java/com/mj/stacktracker/engine/GrayFrame.java',
              'cardchange-engine/src/main/java/com/mj/stacktracker/engine/Homography.java',
              'cardchange-engine/src/main/java/com/mj/stacktracker/engine/PatchTracker.java',
              'cardchange-engine/src/main/java/com/mj/stacktracker/engine/Point2.java',
              'cardchange-engine/src/main/java/com/mj/stacktracker/engine/PrecisionCardChangeEngine.java',
              'cardchange-engine/src/main/java/com/mj/stacktracker/engine/RectRegion.java',
              'cardchange-engine/src/main/java/com/mj/stacktracker/engine/SignatureBank.java',
              'cardchange-engine/src/main/java/com/mj/stacktracker/engine/StackProfile.java',
              'cardchange-engine/src/main/java/com/mj/stacktracker/engine/WarpedPatch.java',
              'cardchange-engine/src/test/java/com/mj/stacktracker/engine/CoreMathTest.java',
          }
          with zipfile.ZipFile(zname) as z:
              bad = z.testzip()
              if bad:
                  sys.exit(f'Corrupt ZIP entry: {bad}')
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  sys.exit('Missing archive entries:\n' + '\n'.join(missing))
              if any(n.startswith(('javac-out/', 'test-stubs/', '.git/', 'app/build/', 'cardchange-engine/build/')) for n in names):
                  sys.exit('Archive contains local build output or test stubs.')
              for xml_name in sorted(n for n in names if n.lower().endswith('.xml')):
                  try:
                      ET.fromstring(z.read(xml_name))
                  except ET.ParseError as exc:
                      sys.exit(f'Invalid XML in {xml_name}: {exc}')

              text = {n: z.read(n).decode('utf-8', errors='replace') for n in required
                      if n.endswith(('.java', '.xml', '.gradle', '.md', '.txt', '.pro'))}
              app_gradle = text['app/build.gradle']
              root_gradle = text['build.gradle']
              settings = text['settings.gradle']
              manifest = text['app/src/main/AndroidManifest.xml']
              main = text['app/src/main/java/com/mj/stacktracker/MainActivity.java']
              detector = text['app/src/main/java/com/mj/stacktracker/FrameDetector.java']
              tracker = text['app/src/main/java/com/mj/stacktracker/TrackManager.java']
              geometry = text['app/src/main/java/com/mj/stacktracker/StackGeometry.java']
              precision = text['cardchange-engine/src/main/java/com/mj/stacktracker/engine/PrecisionCardChangeEngine.java']
              gray = text['cardchange-engine/src/main/java/com/mj/stacktracker/engine/GrayFrame.java']
              core_test = text['cardchange-engine/src/test/java/com/mj/stacktracker/engine/CoreMathTest.java']

              checks = {
                  'versionCode 15 and versionName 0.9.5': 'versionCode 15' in app_gradle and "versionName '0.9.5'" in app_gradle,
                  'stable applicationId preserved for upgrade installs': "applicationId 'com.mj.stacktracker.phase9'" in app_gradle,
                  'Android Gradle Plugin 9.4.0 application and library plugins': "id 'com.android.application' version '9.4.0'" in root_gradle and "id 'com.android.library' version '9.4.0'" in root_gradle,
                  'cardchange-engine module included': "include ':cardchange-engine'" in settings,
                  'app depends on the local precision engine module': "implementation project(':cardchange-engine')" in app_gradle,
                  'existing AndroidX FileProvider support retained': 'androidx.core:core:1.17.0' in app_gradle and 'androidx.core.content.FileProvider' in manifest,
                  'no camera or Internet runtime permission': 'android.permission.CAMERA' not in manifest and 'android.permission.INTERNET' not in manifest,
                  'existing app layout/video and multi-pile logic retained': 'root.addView(videoViewport' in main and 'setContentView(root)' in main and 'new TrackManager(true)' in main and 'findSplitParent(d,tracks)' in tracker,
                  'existing detector candidate bound retained': 'MAX_CANDIDATES = 32' in detector,
                  'rotated stack geometry projection retained': 'Math.abs(Math.cos(delta)) * majorPixels + Math.abs(Math.sin(delta)) * minorPixels' in geometry,
                  'existing no-forced-balance inventory check retained': 'No value has been forced to balance' in main,
                  'precision engine reference lock and frame analysis wired': 'precisionEngine.lockReference(frame' in main and 'precisionEngine.analyze(frame)' in main,
                  'manual 1/2/3 signature training wired': 'teachPendingAs(exactCount)' in main and 'precision_card_change_signatures_v1' in main,
                  'learned signature matches require manual review': 'PRECISION_CARD_CHANGE_CONFIRMED' in main and 'Confirm change' in main,
                  'precision engine does not silently change pile ledger': 'Existing pile count ledger was not modified automatically' in main,
                  'engine uses patch tracking, homography and profile comparison': 'Homography.fitRansac' in precision and 'PatchTracker' in precision and 'StackProfile.distance' in precision,
                  'blur and invalid frame quality gates exist': 'laplacianVariance' in precision and 'Invalid frame rejected' in precision,
                  'scaled Bitmap cleanup and non-finite coordinates guarded': 'recycleScaled' in gray and '!Double.isFinite(x)' in gray,
                  'homography translation and signature persistence tests included': 'translatedObjectIsCompensatedByHomography' in core_test and 'signatureBankRoundTripsLearnedLabels' in core_test,
                  'manifest label updated to Phase 9.5': 'Precision Engine &amp; Lineage 9.5' in manifest,
              }
              for label, ok in checks.items():
                  print(('PASS: ' if ok else 'FAIL: ') + label)
              failed = [label for label, ok in checks.items() if not ok]
              if failed:
                  sys.exit('Phase 9.5 source validation failed: ' + ', '.join(failed))
          print('Phase 9.5 source archive, XML, existing baseline and precision engine validation passed.')
          PY

      - name: Remove stale project tree and extract Phase 9.5 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app cardchange-engine
          rm -f build.gradle settings.gradle gradle.properties
          unzip -oq MJ_STACK_TRACKER_PHASE9_5_PRECISION_ENGINE_SOURCE.zip -d "$GITHUB_WORKSPACE"
          for path in build.gradle settings.gradle gradle.properties app/build.gradle \
                      app/src/main/AndroidManifest.xml cardchange-engine/build.gradle \
                      cardchange-engine/src/main/AndroidManifest.xml; do
            [[ -s "$path" ]] || { echo "ERROR: missing extracted project path: $path"; exit 1; }
          done
          grep -F "versionName '0.9.5'" app/build.gradle
          grep -F "include ':cardchange-engine'" settings.gradle
          echo "The Phase 9.5 source archive is the only app source tree compiled."

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Restore stable debug signing key for app upgrades
        uses: actions/cache/restore@v6
        with:
          path: ~/.android/debug.keystore
          key: mj-stack-tracker-phase9-debug-keystore-v1

      - name: Run app and engine unit tests, then build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Save debug signing key for future compatible installs
        if: success() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/cache/save@v6
        with:
          path: ~/.android/debug.keystore
          key: mj-stack-tracker-phase9-debug-keystore-v1

      - name: Verify APK, package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [[ -s "$APK" ]] || { echo "ERROR: APK missing: $APK"; exit 1; }
          unzip -t "$APK" | tail -n 2
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          [[ -x "$AAPT" ]] || { echo "ERROR: aapt not found at $AAPT"; exit 1; }
          [[ -x "$APKSIGNER" ]] || { echo "ERROR: apksigner not found at $APKSIGNER"; exit 1; }
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.mj.stacktracker.phase9' versionCode='15' versionName='0.9.5'" apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > signing-details.txt
          sha256sum "$APK" | tee apk-sha256.txt
          ls -lh "$APK"

      - name: Upload Phase 9.5 debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MJ-Stack-Tracker-Phase9.5-precision-engine-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            signing-details.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MJ-Stack-Tracker-Phase9.5-build-diagnostics
          path: |
            build.log
            apk-badging.txt
            app/build/reports/tests/testDebugUnitTest/**
            cardchange-engine/build/reports/tests/testDebugUnitTest/**
            app/build/reports/**
            cardchange-engine/build/reports/**
          if-no-files-found: warn
          retention-days: 30
