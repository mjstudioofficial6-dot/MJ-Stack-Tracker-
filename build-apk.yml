name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MJ Stack Tracker BUILD-0
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check source ZIP
        run: |
          test -s MJ_Stack_Tracker_BUILD0_SOURCE.zip
          echo "Source ZIP found."

      - name: Extract Android project
        run: |
          unzip -oq MJ_Stack_Tracker_BUILD0_SOURCE.zip -d .

          test -s build.gradle
          test -s settings.gradle
          test -s gradle.properties
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/mjthakur/stacktracker/MainActivity.java

          echo "Android project structure OK."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Create Gradle Wrapper
        run: |
          gradle --no-daemon wrapper \
            --gradle-version 9.6.0 \
            --distribution-type bin

      - name: Verify Gradle Wrapper
        run: |
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MJ-Stack-Tracker-BUILD-0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
